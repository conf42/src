# Topic hubs (build/topics.py): conf42.com/topics/<slug>. match = regex over Title + Keywords; events = every talk of
# those events belongs. No intro = no page. Intros describe what the talks under the hub actually cover.
- slug: kubernetes
  name: Kubernetes
  match: kubernetes|\bk8s\b|\bhelm\b|kubectl|\bkube\b
  intro: 'Conf42 speakers have been taking Kubernetes apart since 2020: running vLLM GPU inference across clouds, scaling past what HPA and VPA can do, isolating tenants in cells, and asking whether an
    operator can replace a DBA. These talks are about clusters in production, not hello-world deployments.'
- slug: observability
  name: Observability
  match: observability|\bobservable\b
  intro: 'Observability talks from Conf42 Observability, SRE, Cloud Native and more: tracing the decisions and tool calls of AI agents, green telemetry pipelines, accessibility as a fifth golden signal,
    and why green dashboards can still hide broken systems.'
- slug: opentelemetry
  name: OpenTelemetry
  match: opentelemetry|\botel\b
  intro: 'OpenTelemetry from the people who run it: Collector configuration, scaling collectors with Kafka, metrics handbooks, beginner guides to traces, metrics and logs, and field reports on where OTel
    solves problems and where it creates new ones.'
- slug: distributed-tracing
  name: Distributed tracing
  match: distributed tracing|(?<!contact )\btracing\b|\btraces\b
  intro: 'Distributed tracing at Conf42: following requests across services and, lately, following AI agents across tool calls and recovery paths. Includes synthetic traces for critical user journeys, OpenTelemetry
    tracing introductions and tracing in CI/CD.'
- slug: sre
  name: Site Reliability Engineering
  match: \bsre\b|site reliability|\bslos?\b|error budget
  intro: 'Site Reliability Engineering talks: SLOs that measure value rather than uptime, LLM copilots for incident response and auto-remediation, SRE for regulated reporting and clinical systems, and the
    human side of on-call. Most come from the Conf42 SRE conference, with more from Observability, Platform Engineering and LLMs.'
- slug: chaos-engineering
  name: Chaos engineering
  match: chaos engineering|chaos experiments?|fault injection|chaos monkey|chaos mesh|litmus|game ?days?
  intro: 'Chaos engineering at Conf42: fault injection on Amazon ECS and Fargate, chaos experiments for microservices, mobile apps and cloud databases, AI-assisted failure testing, and how teams build a
    chaos-first culture. Breaking things on purpose, with a hypothesis.'
- slug: incident-management
  name: Incident management
  match: incident|on-call|oncall|postmortem|post-mortem
  intro: 'Incident management talks: AI-assisted root cause analysis, LLMs and MCP in incident response, feature flags as incident evidence, regulatory incidents under HIPAA and GDPR, and reducing on-call
    pain. From Conf42 Incident Management, SRE, DevSecOps and more.'
- slug: platform-engineering
  name: Platform engineering
  match: platform engineering|internal developer platform|developer portal|backstage|golden path
  intro: 'Platform engineering at Conf42: internal developer platforms for generative AI, guardrails for AI-generated frontends, platforms for payments, healthcare and real-time bidding, and the paved roads
    (and compliance gates) teams build for their developers.'
- slug: devops
  name: DevOps
  match: devops
  intro: 'DevOps talks across Conf42: database DevOps and schema migrations, CD for stateful applications, context engineering for infrastructure, active-active failover, and the pipelines that ship ML
    and AI features in finance, insurance and healthcare.'
- slug: ci-cd
  name: CI/CD
  match: ci/cd|\bcicd\b|continuous (integration|delivery|deployment)|github actions|jenkins|gitlab ci
  intro: 'CI/CD talks: self-healing pipelines with Tekton and Argo CD, AI-era DevSecOps playbooks, schema migrations in CI, GPU performance validation, agentic deployment frameworks, and what a green checkmark
    still can''t catch.'
- slug: gitops
  name: GitOps
  match: gitops|argo ?cd|\bflux\b
  intro: 'GitOps at Conf42: Argo CD versus Flux, multi-cluster Kubernetes with GitOps, secrets management, Terraform plus Kubernetes as code, and self-healing delivery pipelines. Declarative everything,
    reconciled from Git.'
- slug: infrastructure-as-code
  name: Infrastructure as code
  match: infrastructure as code|\biac\b|pulumi|terraform|opentofu|crossplane
  intro: 'Infrastructure as code: Terraform best practices and custom Terraform providers, multi-cloud DevSecOps automation, LLM-driven IaC, network automation for SD-WAN and zero trust, and how an attacker
    can abuse external Terraform state.'
- slug: devsecops
  name: DevSecOps
  match: devsecops
  intro: 'DevSecOps talks: workload identity instead of secrets, AI agents that automate secure delivery and incident response, going beyond GitHub Advanced Security, secure enterprise RAG, and DevSecOps
    culture without burning out developers.'
- slug: supply-chain-security
  name: Software supply chain security
  match: software supply chain|supply chain (security|defen[cs]e|attacks?)|\bsbom|\bslsa\b|sigstore|provenance
  intro: ''
- slug: zero-trust
  name: Zero trust
  match: zero[- ]trust
  intro: 'Zero trust at Conf42: continuous verification instead of perimeters, zero-trust MLOps pipelines, confidential computing for VMs, zero trust in Rust network infrastructure and 5G DevOps pipelines,
    and compliance engines that enforce it.'
- slug: identity
  name: Identity and access
  match: identity|\biam\b|oauth|authentication|authori[sz]ation|\bsso\b
  intro: 'Identity and access talks: authorization for AI agents and ML pipelines, permission-leak evals, deterministic authorization for coding agents, workload identity, Keycloak at SASE scale and sub-50
    ms IAM for gaming platforms.'
- slug: cloud-security
  name: Cloud security
  match: cloud security|cloud-native security|securing (the )?cloud
  intro: 'Cloud security talks: cloud security posture management, AI-driven threat detection across clouds, quantum-resistant Kubernetes, chaos-driven security testing and real attacks on cloud environments,
    from Conf42 DevSecOps, SRE, Golang, Python and more.'
- slug: ai-security
  name: AI security and guardrails
  match: (ai|llm|genai|agent) (security|safety|red[- ]team)|prompt injection|guardrails|securing (ai|llm)
  intro: 'AI security and guardrails: what 390 prompt injection attacks taught one team about single-layer guardrails, gating an agent''s actions before it runs, securing API-backed AI systems, and why
    you shouldn''t fully trust AI agents in production.'
- slug: llms
  name: Large language models
  match: \bllms?\b|large language model
  intro: 'Large language models in production: eval-as-code, LLM data processing at billions of documents, LLM-powered testing, copilots for SRE, guardrails, and when an agent doesn''t need an LLM at all.
    Mostly from Conf42 LLMs, MLOps, Prompt Engineering and AI Agents.'
- slug: ai-agents
  name: AI agents
  match: \bai agents?\b|agentic|\bagents\b|multi-agent
  intro: 'AI agents at Conf42: running 50+ agents in production, write-gates for agent fleets, agent identity and authorization, observability for agent trajectories, evals as deployment artifacts, and
    the patterns that held up when agents met real systems.'
- slug: rag
  name: Retrieval-augmented generation (RAG)
  match: \brag\b|retrieval[- ]augmented
  intro: 'Retrieval-augmented generation (RAG): Graph-RAG to stop agents making up facts, RAG for regulated enterprises, attacks on RAG systems, better context for enterprise AI, RAG for data engineers,
    and performance engineering for RAG platforms.'
- slug: generative-ai
  name: Generative AI
  match: generative ai|\bgenai\b|\bgen ai\b
  intro: 'Generative AI talks: evaluating GenAI in production, quality gates for releasing GenAI features, internal platforms for foundation models, governance for AI in CI/CD, and GenAI in healthcare claims,
    fintech and climate risk.'
- slug: prompt-engineering
  name: Prompt engineering
  match: prompt
  intro: 'Prompt engineering at Conf42: stable prompts and prompt drift, debugging the plan rather than the answer, context and contracts for reliable agents, prompt injection defences, and prompting for
    compliance workflows. Mostly from Conf42 Prompt Engineering.'
- slug: mlops
  name: MLOps and LLMOps
  match: mlops|\bml ops\b|llmops
  intro: 'MLOps and LLMOps: data quality before the model, compliance as a pipeline stage, edge MLOps from PyTorch to on-device inference, securing the AI factory, and reliable ML pipelines for ranking,
    finance and healthcare. Mostly from Conf42 MLOps.'
- slug: machine-learning
  name: Machine learning
  match: machine learning|\bml\b|deep learning
  intro: 'Machine learning talks across Conf42: production ML for forecasting and IT support, deep learning pipelines for medical imaging, fairness in compliant models, ML workflows with Codex, Flyte and
    MCP, and ML training profiling in Go.'
- slug: serverless
  name: Serverless
  match: serverless|\blambda\b
  intro: 'Serverless at Conf42: five years of lessons from serverless databases, AWS Step Functions versus agents, observability for serverless workflows, migrating monoliths to serverless, and real-time
    alerting built on serverless and Kafka.'
- slug: aws
  name: AWS
  match: \baws\b|amazon web services
  intro: 'AWS talks: observing AWS AgentCore with Datadog, prompt injection testing on AWS, blue/green deployments, Fluent Bit on EKS, serverless observability, Rust on AWS, and running compliance without
    abandoning your stack.'
- slug: azure
  name: Microsoft Azure
  match: \bazure\b
  intro: 'Microsoft Azure talks: Copilot for Azure operations, real-world Azure attacks, landing zones, Azure Site Recovery, Azure Load Testing, Databricks pipelines at 10 TB+ and managing LLMs with Azure
    AI Foundry.'
- slug: microservices
  name: Microservices
  match: microservices?
  intro: 'Microservices talks: shared-cluster platforms for microservice development, microservices versus monolith decision frameworks, API gateways, payment gateway migrations, and observability for microservices
    with agentic LLMs.'
- slug: ebpf
  name: eBPF
  match: ebpf
  intro: 'eBPF at Conf42: how kernel programming escaped the kernel, zero-instrumentation observability, network observability, writing custom eBPF programs, Cilium, Falco, securing CI runners and low-overhead
    Python profiling.'
- slug: rust
  name: Rust
  match: \brust\b|rustlang|rust-
  intro: 'Rust talks: memory-safe DevSecOps pipelines, Rust for network infrastructure, data lakes and edge AI, carbon-aware Kubernetes scheduling, Rust on AWS and lessons from translating JVM data connectors
    to Rust. Mostly from Conf42 Rustlang.'
- slug: golang
  name: Go
  match: golang|goroutines?|\bin go\b|\bwith go\b|\bgo[- ]based\b|\bgo (services?|code|apps?|applications?|programs?|developers?|runtime|concurrency|generics|modules|microservices|backends?)\b
  intro: 'Go talks from Conf42 Golang and beyond: an MCP server in Go for a B2B workflow, ML training profiling, resilient search fallbacks, real-time leaderboards from O(N²) to O(log N), streaming pipelines,
    secure CI/CD automation and fintech systems in Go.'
- slug: python
  name: Python
  match: python|django|fastapi|\bflask\b|pandas|pytorch
  intro: 'Python talks: concurrency patterns and when to use which, dunder methods, scaling Python apps with async orchestration, secure cloud applications, PyTorch to on-device inference, and Python for
    data and security work.'
- slug: javascript
  name: JavaScript and TypeScript
  match: javascript|typescript|node\.?js|\breact\b|next\.?js|\bdeno\b|\bbun\b|\bvue\b|angular
  intro: 'JavaScript and TypeScript talks: the state of JavaScript testing, accessibility, browser security policies, securing Node.js and frontend code, micro frontends, performance optimisation and TypeScript
    for game development.'
- slug: data-engineering
  name: Data engineering
  match: data engineering|data pipelines?|\betl\b|data lake|lakehouse|\bspark\b|airflow|\bdbt\b
  intro: 'Data engineering talks: scaling data pipelines across teams, lakehouse architectures, Flink on Kubernetes, Spark data-skew fixes, ETL versus unified platforms, and turning data pipelines into
    AI products.'
- slug: databases
  name: Databases
  match: database|postgres|mysql|mongodb|\bsql\b|redis|cassandra
  intro: 'Database talks: agentic text-to-SQL for 30 million users, lessons from serverless databases, schema migrations in CI/CD, database DevOps, distributed database trade-offs and AI-assisted database
    operations. Many from Conf42 Database DevOps.'
- slug: streaming
  name: Streaming and real-time data
  match: streaming|real[- ]time data|\bflink\b|kafka
  intro: 'Streaming and real-time data: Kafka and Flink pipelines, self-healing streaming in Go, IoT data streams at scale, real-time payments and real-time systems engineered for speed and resilience.'
- slug: testing
  name: Testing
  match: testing|\bqa\b|test automation
  intro: 'Testing talks: LLM-as-judge for non-deterministic code, evals for agents and LLMs, resilience testing in the SDLC, the state of JavaScript testing, and why observability alone can''t prove a system
    works.'
- slug: quantum-computing
  name: Quantum computing
  match: quantum
  intro: 'Quantum computing talks: post-quantum cryptography for APIs and Kubernetes, quantum-era security for robot networks, quantum computing on AWS, quantum-enhanced streaming and SaaS architectures,
    and tooling for quantum R&D. Many from Conf42 Quantum Computing.'
- slug: iot
  name: Internet of Things
  match: \biot\b|internet of things
  intro: 'Internet of Things talks: IoT data lakehouses, payment systems for connected devices, IoT messaging at scale, edge architectures for medical diagnostics, IoT supply chain security and monitoring
    plants with IoT sensors and Grafana Cloud.'
- slug: edge-computing
  name: Edge computing
  match: edge computing|\bat the edge\b|\bedge ai\b
  intro: 'Edge computing talks: edge AI with Rust, real-time inference for autonomous vehicles, smart cameras without cloud dependency, TinyML for IoT and GPU-accelerated AI at the edge.'
- slug: fintech
  name: Fintech and banking
  match: fintech|banking|payments?|financial services
  intro: 'Fintech and banking talks: payment systems, stablecoins as payment infrastructure, decoupling legacy core banking, fraud detection in Go, compliant digital onboarding and feature flags as a migration
    engine for payment monoliths.'
- slug: healthcare
  name: Healthcare tech
  match: healthcare|health care|clinical|medical
  intro: 'Healthcare tech talks: reliable AI for clinical handoffs, evals for an LLM writing clinical configuration, real-time sepsis detection pipelines, data quality for healthcare ML, and automating
    compliance in healthcare systems.'
- slug: fraud-detection
  name: Fraud detection
  match: fraud
  intro: 'Fraud detection talks: temporal graph attention and transformers for fraud, behavioural analytics for real-time prevention, LLM document correlation for financial compliance, fraud in healthcare
    claims, and MLOps for fraud models.'
- slug: compliance
  name: Compliance and regulation
  match: compliance|regulat|gdpr|soc ?2|hipaa
  intro: 'Compliance and regulation talks: compliance as a pipeline stage, shipping agentic AI in a regulated enterprise, HIPAA, GDPR and DMA incidents, compliance gates on the paved road, and prompt engineering
    for AML and NEPA compliance.'
- slug: mobile
  name: Mobile development
  match: mobile|android|\bios\b|flutter|swift
  intro: 'Mobile development talks: five autonomous teams shipping into one 53-million-user app, internal mobile platforms, mobile testing infrastructure, white-label Android apps, mobile payments and chaos
    engineering for mobile apps.'
- slug: frontend
  name: Frontend engineering
  match: frontend|front-end|\bui\b
  intro: 'Frontend engineering talks: guardrails for AI-generated frontends, SRE-driven frontend architecture, micro frontends, frontend observability, securing frontend and Node.js code and front-end analytics.'
- slug: webassembly
  name: WebAssembly
  match: webassembly|\bwasm\b
  intro: ''
- slug: feature-flags
  name: Feature flags
  match: feature[- ]flags?|feature toggles?|progressive delivery
  intro: 'Feature flag talks from Conf42 Feature Flags: flags as incident evidence, as a migration engine for monoliths, for safer ML model rollouts, adaptive risk control after rollout, and flag-driven
    self-healing infrastructure.'
