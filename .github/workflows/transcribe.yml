name: Transcribe
# manual trigger
on: 
  workflow_dispatch:
    inputs:
      ids:
        description: "Only these YouTube IDs, comma separated (empty = every talk without a transcript, up to 100)"
        required: false
        default: ""
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install
        run: |
          make deps

      - name: Build 🔧
        env:
          ASSEMBLYAI_KEY: ${{ secrets.ASSEMBLYAI_KEY }}
          TRANSCRIBE_IDS: ${{ github.event.inputs.ids }}
        run: |
          make transcribe

      - name: Commit files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assemblyai
          git commit -a -m "Transcription"

      - name: Deploy 🚀
        run: |
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && break
            git fetch -q --depth=20 origin main && git rebase -q origin/main
          done