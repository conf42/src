name: Blog rollout
# Google-safe gradual publishing of the queued blog posts (Status=queued in _db/blog.csv; Marek 2026-11-10: every
# conference since 2020 + every talk with a transcript, over days, never one big drop). Same job as blog/rollout.sh,
# but on GitHub so it runs without a laptop: every 4 hours, release the PER_SLICE newest
# queued posts, commit, then start the deploy (a push made with the workflow token does not trigger it by itself).
# Nothing queued = nothing happens. Pause: disable this workflow in the Actions tab.
on:
  schedule:
    - cron: "20 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  PER_SLICE: "36"   # 6 slices a day = 216 posts/day

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: blog-rollout
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('build/requirements.txt') }}

      - name: Install
        run: make deps

      - name: Release a slice
        id: release
        env:
          DESCRIPT_API_TOKEN: ${{ secrets.DESCRIPT_API_TOKEN }}
        run: |
          # no sweep here: the build already hides posts whose talk or video link is gone; the YouTube sweep
          # (deleted videos, wrong links) runs on the laptop (blog_plan orphan) - runners are refused by YouTube
          # missing transcripts of finished events from Descript (Marek 2026-11-11); the nightly writer turns them
          # into posts. A talk Descript does not have gets no post. No DESCRIPT_API_TOKEN secret = skipped.
          python -m build.blog_plan descript || echo "descript fetch failed - carrying on"
          LEFT=$(python -m build.blog_plan release "$PER_SLICE" | tail -1)
          echo "$LEFT"
          if [ -z "$(git status --porcelain _db/blog.csv srt/)" ]; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _db/blog.csv srt/
          git commit -qm "Blog: release $PER_SLICE queued posts ($LEFT)"
          # the checkout is shallow (a plain pull --rebase hangs on it): push, and if main moved meanwhile, rebase
          # onto a shallow fetch of it and try again
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && break
            git fetch -q --depth=20 origin main && git rebase -q origin/main
          done
          echo "changed=1" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.release.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static-build.yml --ref main
