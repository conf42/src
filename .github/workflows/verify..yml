name: Verify all remote addresses
# Daily rather than per push: a full check takes 7-19 minutes.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
concurrency:
  group: verify
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install
        run: |
          make deps

      - name: Build 🔧
        run: |
          make verify
