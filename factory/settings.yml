# Conf42 factory settings - change anything here (or in the local app) and the next run uses it.

# Descript project that collects all talks of one event (one composition per talk).
# {name} and {year} come from the event in metadata.yml, e.g. "Conf42 DevSecOps 2026".
project_name: "Conf42 {name} {year}"

# The edit, done by Descript's AI editor. Values are filled into the prompt below.
studio_sound_percent: 80
volume_percent: 300          # Descript gain (3x) before the limiter
gap_over_seconds: 2          # word gaps longer than this ...
gap_to_seconds: 1            # ... are shortened to this
max_edit_credits: 20         # an edit costing more pauses all further edits (normal: 8-12 per talk)
# {composition} in the prompt = the talk's composition name (the speakers), so the AI editor never touches other talks.
edit_prompt: >-
  Work ONLY on the composition "{composition}" (the one this request is for).
  Do not open, edit or apply settings to any other composition or clip in the project.
  In "{composition}": apply Studio Sound at {studio_sound_percent}% intensity.
  Add a limiter and increase the volume to {volume_percent}%.
  Remove all filler words.
  Shorten every word gap longer than {gap_over_seconds} seconds to {gap_to_seconds} second.
  Do not change anything else.
  When done, list exactly which settings you applied and their values.

# Export from Descript: the largest of 480p/720p/1080p/1440p/4K that is not above the source or this cap.
max_resolution: 1080p
publish_access: unlisted     # the share link Descript creates for the download

# Final loudness, measured and set per video by ffmpeg after Descript (video stream copied, no quality loss).
# -14 LUFS / -1.5 dBTP = YouTube's playback level, the loudest a talk can be without YouTube turning it down.
loudness_lufs: -14
true_peak_db: -1.5

# Slide decks: anything that is not a PDF is converted (LibreOffice), every PDF over this size is compressed.
slides_max_mb: 5

# QA flags on the tracker
qa_loudness_tolerance: 1.0   # flag if the final loudness is further than this from the target
qa_max_cut_percent: 25       # flag if the edit removed more than this share of the talk

# Where everything lands (relative to the Desktop): <folder>/<short_url>/{in,out,srt,state.json}
work_folder: talk-factory

# The unlisted page conf42.com/factory is updated after a talk finishes, at most this often (0 = only at the end)
status_publish_minutes: 20

# How many talks go through Descript at the same time
parallel_talks: 2

# Descript plan allowance per month (Descript > Settings > Billing). Descript's API has no balance endpoint, so the
# dashboard shows "left" = these minus what the API used this calendar month. Leave empty to show usage only.
plan_ai_credits_month:
plan_media_minutes_month:
