# Conf42 factory settings - change anything here (or in the local app) and the next run uses it.

# Descript project that collects all talks of one event (one composition per talk).
# {name} and {year} come from the event in metadata.yml, e.g. "Conf42 DevSecOps 2026".
project_name: "Conf42 {name} {year}"

# The edit, done by Descript's AI editor. Values are filled into the prompt below.
studio_sound_percent: 80
volume_percent: 300          # Descript gain (3x) before the limiter
gap_over_seconds: 2          # word gaps longer than this ...
gap_to_seconds: 1            # ... are shortened to this
max_edit_credits: 35         # an edit costing more pauses all further edits (normal 8-23: cost follows the number of fillers)
# {composition} in the prompt = the talk's composition name (the speakers), so the AI editor never touches other talks.
edit_prompt: >-
  Work ONLY on the composition "{composition}" (the one this request is for).
  Do not open, edit or apply settings to any other composition or clip in the project.
  In "{composition}": apply Studio Sound at {studio_sound_percent}% intensity.
  Add a limiter and increase the volume to {volume_percent}%.
  Remove all filler words.
  Shorten every word gap longer than {gap_over_seconds} seconds to {gap_to_seconds} second.
  Do not change anything else.
  When done, list exactly which settings you applied and their values.

# Export from Descript: the largest of 480p/720p/1080p/1440p/4K that is not above the source or this cap.
max_resolution: 1080p
publish_access: unlisted     # the share link Descript creates for the download

# Trim to the speech: the finished video starts trim_lead_seconds before the first word and ends trim_tail_seconds after
# the last one (from the transcript; the SRT and chapters move with it). QA flags a talk whose picture changes in its
# first 12 seconds ("check the start"): usually the speaker's OBS or desktop before the slides. The health check
# (below) cuts that before the upload when nobody talks over it; this flag is the last check on the finished video.
trim_to_speech: true
trim_lead_seconds: 0.3
trim_tail_seconds: 1.0

# Video health check, locally before the upload (Marek 2026-10-17), so a broken talk never costs Descript credits:
# - sound on one channel only (or two channels cancelling out) is fixed;
# - no sound track, muted sound, or sound in less than health_min_sound_percent of the video stops the talk: it is not
#   uploaded and lands on the "needs a new video from the speaker" list (sound-less slides are not a conference talk);
# - setup junk is cut off: the speaker clicking around, the desktop before the slides, "stop sharing" at the end - the
#   busy picture before the first (after the last) stretch of health_calm_seconds where the slides stay put, up to
#   health_max_cut_seconds at each end, looked for in the first / last health_window_seconds. Never cut when the
#   speaker talks over it (1.2 s+ of sound in a row, or 2.5 s altogether; a cough or a click is shorter) - then the
#   talk is flagged instead. The cut is made in one encode from the speaker's original file.
health_check: true
health_min_sound_percent: 15
health_window_seconds: 180
health_calm_seconds: 15
health_max_cut_seconds: 120

# Final loudness, measured and set per video by ffmpeg after Descript (video stream copied, no quality loss).
# -14 LUFS / -1.5 dBTP = YouTube's playback level, the loudest a talk can be without YouTube turning it down.
loudness_lufs: -14
true_peak_db: -1.5

# Slide decks: anything that is not a PDF is converted (LibreOffice), every PDF over this size is compressed.
slides_max_mb: 5

# QA flags on the tracker
qa_loudness_tolerance: 1.0   # flag if the final loudness is further than this from the target
qa_max_cut_percent: 25       # flag if the edit removed more than this share of the talk

# Where everything lands (relative to the Desktop): <folder>/<short_url>/{in,out,srt,state.json}
work_folder: talk-factory
# The finished videos of every event, ready for YouTube: <work_folder>/<final_folder>/<speakers> - Conf42 <Event> <Year>.mp4
final_folder: final videos for YouTube

# The unlisted page conf42.com/factory is updated after a talk finishes, at most this often (0 = only at the end)
status_publish_minutes: 20

# How many talks go through Descript at the same time
render_parallel: auto        # mp4 renders at once: auto = up to 8 on the RTX 5090 (fewer while the encoder is
                             # busy or the card runs hot), 3 on other NVIDIA cards, 2 on CPU; or a number
parallel_talks: 2

# Descript plan allowance per month (Descript > Settings > Billing). Descript's API has no balance endpoint, so the
# dashboard shows "left" = these minus what the API used this calendar month. Leave empty to show usage only.
plan_ai_credits_month:
plan_media_minutes_month:

# "YouTube items.txt" per event: title (<= title_max characters) "<short title> | <Speakers> | Conf42 <CODE><YEAR>"
# + description (links + chapters). event_codes: short event names for the title; missing ones are derived
# (CamelCase capitals, else initials: "Site Reliability Engineering" -> SRE).
youtube:
  title_max: 100
  site: https://www.conf42.com/
  apply_url: https://cfp.ninja/?q=conf42&status=open
  discord_url: https://discord.gg/yQneDJdJGV
  event_codes:
    DevSecOps: DSO
