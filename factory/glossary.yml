# Transcript glossary: sure-fire fixes the proofread step makes before Claude reads a transcript (Marek 2026-10-29).
# Descript transcribes well but knows nothing about software engineering: "CON forty-two", "future flags", "L LMS".
# Each entry: a regex (case-insensitive) and what it becomes. `events` limits an entry to events whose name matches that
# regex (e.g. "Feature Flags"); leave it out for every event. Add a line whenever a new mistake shows up twice.
# Claude's pass (proofread_model in settings.yml) catches the rest from the talk's context - this list only makes the
# common ones free, instant and identical everywhere.
fixes:
  - from: '\b(?:con|conf|conference)[\s-]*(?:42|forty[\s-]*(?:two|to|too))\b(?!\.\w)'
    to: Conf42
  - from: '\bconforty[\s-]*(?:two|to|too)\b'
    to: Conf42
  - from: '\bL\s+LMs\b'
    to: LLMs
  - from: '\bL\s+LM\b'
    to: LLM
  - from: '\bfuture[\s-]flag'
    to: feature flag
    events: 'Feature Flags'
  - from: '\bchat\s?gpt\b'
    to: ChatGPT
