<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conf42 factory</title>
<style>
:root{--ink:#1a1a2e;--mut:#7a7f93;--line:#eceef4;--bg:#f5f6fa;--card:#fff;--pur:#6b40d8;--pur2:#9b7bf0;--grn:#1f9d55;--grnbg:#dcf3e5;
 --amb:#c98a00;--ambbg:#fff2cc;--red:#c0392b;--redbg:#fde2e1;--q:#ece7fb}
*{box-sizing:border-box} body{font-family:Segoe UI,Arial,sans-serif;margin:0;color:var(--ink);background:var(--bg)}
.wrap{max-width:1500px;margin:0 auto;padding:22px 24px 60px}
h1{margin:0;font-size:22px} .sub{color:var(--mut);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button{font:inherit;font-size:14px} select{padding:7px 10px;border-radius:9px;border:1px solid #cfd3df;background:#fff}
button{padding:7px 13px;border-radius:9px;border:1px solid #cfd3df;background:#fff;cursor:pointer} button:hover{border-color:var(--pur)}
button.go{background:var(--pur);color:#fff;border-color:var(--pur)}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(20,20,50,.06),0 8px 24px -16px rgba(20,20,50,.18);padding:16px 18px;margin:12px 0}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;background:#bbb;display:inline-block}
.dot.on{background:#22a355;animation:pulse 1.6s infinite} @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,163,85,.45)}70%{box-shadow:0 0 0 9px rgba(34,163,85,0)}100%{box-shadow:0 0 0 0 rgba(34,163,85,0)}}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:18px} @media(max-width:1000px){.hero{grid-template-columns:1fr}}
.big{font-size:30px;font-weight:700} .kpi{display:flex;gap:26px;flex-wrap:wrap;margin-top:6px} .kpi div{font-size:13px;color:var(--mut)} .kpi b{display:block;font-size:20px;color:var(--ink)}
.track{height:12px;background:#eef0f6;border-radius:99px;overflow:hidden;position:relative;margin-top:10px}
.fill{height:100%;background:linear-gradient(90deg,var(--pur),var(--pur2));border-radius:99px;transition:width .8s ease}
.fill.g{background:linear-gradient(90deg,#1f9d55,#4cc47f)}
.now{font-size:14px;line-height:1.55} .now .row{display:flex;gap:10px;align-items:baseline} .now .k{min-width:84px;color:var(--mut);font-size:13px}
.queue{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px} .chip{background:var(--q);color:#4b2fa6;border-radius:99px;padding:3px 10px;font-size:12.5px}
.chip b{font-weight:600}
table{width:100%;border-collapse:collapse} th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
tr.fin td{opacity:.75} tr.act td{background:#fbfaff}
.who b{font-size:14.5px} .who small{display:block;color:var(--mut);font-size:12px;margin-top:2px;max-width:340px}
.pipe{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;min-width:520px}
.seg{position:relative} .seg .t{height:10px;border-radius:99px;background:#eef0f6;overflow:hidden}
.seg .f{height:100%;width:0;border-radius:99px;transition:width .9s linear}
.seg .l{font-size:11px;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.done .f{width:100%;background:var(--grn)} .seg.done .l{color:var(--grn)}
.seg.run .f{background:linear-gradient(90deg,var(--pur),var(--pur2))} .seg.run .l{color:var(--pur);font-weight:600}
.seg.wait .t{background:repeating-linear-gradient(45deg,#ffe7a3 0 8px,#fff2cc 8px 16px);background-size:22px 22px;animation:stripes 1s linear infinite}
.seg.wait .l{color:var(--amb);font-weight:600} @keyframes stripes{to{background-position:22px 0}}
.seg.fail .t{background:var(--red)} .seg.fail .l{color:var(--red);font-weight:600}
.seg.q .t{background:var(--q)}
.stat{min-width:250px;font-size:13.5px} .stat .m{color:var(--mut);font-size:12.5px;display:block;margin-top:2px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.p-run{background:#ece5ff;color:var(--pur)} .p-wait{background:var(--ambbg);color:var(--amb)} .p-done{background:var(--grnbg);color:var(--grn)}
.p-q{background:var(--q);color:#4b2fa6} .p-fail{background:var(--redbg);color:var(--red)} .p-idle{background:#eef0f6;color:var(--mut)}
details{margin-top:6px} summary{cursor:pointer;color:var(--mut);font-size:13px}
pre{white-space:pre-wrap;font-size:12px;max-height:260px;overflow:auto;background:#fafbfd;padding:10px;border-radius:8px}
textarea{width:100%;height:320px;font-family:Consolas,monospace;font-size:13px}
.warn{color:var(--red)} .mut{color:var(--mut)} a{color:var(--pur)}
.jobs td{padding:6px 8px;font-size:12.5px}
</style></head><body><div class="wrap">
<div class="top"><div><h1>Conf42 factory</h1><div class="sub">Drive download &rarr; mp4 render &rarr; Descript &rarr; finished MP4 + SRT on the Desktop</div></div>
<div class="bar"><select id="ev"></select><button class="go" onclick="post('start')">Start / resume</button>
<button onclick="post('open')">Open output folder</button><button onclick="post('publish')">Publish to conf42.com/factory</button>
<button onclick="toggleSet()">Settings</button><span class="live"><span id="ldot" class="dot"></span><span id="lupd">connecting...</span></span></div></div>
<div id="msg" class="mut"></div>
<div class="card hero"><div id="overall"></div><div id="nowbox" class="now"></div></div>
<div class="card" style="overflow-x:auto"><table><thead><tr><th>Talk</th><th>Pipeline</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="card"><details><summary>Descript job history</summary><div id="jobs"></div></details>
<details><summary>Log</summary><pre id="log"></pre></details>
<details id="setbox"><summary>Settings (settings.yml)</summary><textarea id="yml"></textarea><br><button class="go" onclick="saveSet()">Save settings</button></details></div>
</div>
<script>
const $=id=>document.getElementById(id);
const STEPS=__STEPS__;
const NAMES={render:'Render mp4',upload:'Upload',edit:'Edit',publish:'Publish',download:'Download',srt:'SRT',loudness:'Loudness',qa:'QA'};
const VERB={render:'Rendering to mp4',upload:'Uploading',edit:'Descript editing',publish:'Descript publishing',download:'Downloading',srt:'Getting the SRT',loudness:'Setting YouTube loudness',qa:'Checking'};
let S=null,N=null,lastOk=0,alive=false;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const secs=iso=>iso?(Date.now()-new Date(iso).getTime())/1000:0;
function dur(s){s=Math.max(0,Math.round(s));if(s<60)return s+' s';if(s<3600)return Math.round(s/60)+' min';return Math.floor(s/3600)+' h '+Math.round(s%3600/60)+' min'}
function clock(iso){return iso?new Date(iso).toTimeString().slice(0,5):''}
async function j(u,o){const r=await fetch(u,o);return r.json()}

function stepPct(t,k,st){  // live percent for a running step: real percent when Descript/ffmpeg gives one, else time-based
  const x=t.steps[st]||{}, exp=(S.expect[k]||{})[st]||60, el=secs(x.started||x.at);
  let pct=Math.min(97,el/exp*100), left=Math.max(5,exp-el);
  if(x.percent!=null&&+x.percent>0&&el>5){const real=+x.percent, rate=real/el;   // %/s measured so far
    pct=Math.min(99,real+secs(x.at)*rate); left=Math.max(3,(100-pct)/rate)}
  return {pct:Math.max(2,pct),left,el,exp}
}
function talkLeft(k,t){  // seconds of work still ahead of this talk
  if(t.finished)return 0;let s=0;
  for(const st of STEPS){const x=t.steps[st]||{};if(x.status==='done')continue;
    const e=(S.expect[k]||{})[st]||60; s+= x.status==='running'?Math.max(10,e-secs(x.started||x.at)):e}
  return s}
function descriptBusy(){const r=((N&&N.descript&&N.descript.jobs)||[]).find(x=>x.state==='running');return r}

function render(){
  if(!S||!S.state){$('rows').innerHTML='<tr><td colspan=4 class=mut>Not started. Put the Drive zips on the Desktop (or ask Claude), then press Start.</td></tr>';$('overall').innerHTML='';$('nowbox').innerHTML='';return}
  const talks=Object.entries(S.state.talks), sm=S.summary;
  // ---- overall
  const total=talks.length, fin=talks.filter(([k,t])=>t.finished).length;
  let doneSteps=0; talks.forEach(([k,t])=>STEPS.forEach(st=>{const x=t.steps[st]||{};if(x.status==='done')doneSteps+=1;else if(x.status==='running')doneSteps+=stepPct(t,k,st).pct/100}));
  const pct=total?doneSteps/(total*STEPS.length)*100:0;
  const par=Math.max(1,(S.parallel||2)), leftAll=talks.reduce((a,[k,t])=>a+talkLeft(k,t),0)/par;
  const eta=new Date(Date.now()+leftAll*1000);
  $('overall').innerHTML=`<div class=mut style="font-size:13px">${esc(S.title||'')}</div><div class=big>${fin} of ${total} talks finished</div>
   <div class=track><div class="fill ${fin===total?'g':''}" style="width:${pct.toFixed(1)}%"></div></div>
   <div class=kpi><div>overall<b>${pct.toFixed(0)}%</b></div><div>time left (estimate)<b>${fin===total?'-':'~'+dur(leftAll)}</b></div>
   <div>ready around<b>${fin===total?'done':eta.toTimeString().slice(0,5)}</b></div><div>no video yet<b>${sm.missing_videos.length}</b></div>
   <div>AI credits paid<b>${N?('~'+N.credits):'...'}</b></div></div>`;
  // ---- right now
  const busy=descriptBusy(), q=talks.filter(([k,t])=>t.queued).sort((a,b)=>a[1].queued-b[1].queued);
  const working=talks.filter(([k,t])=>!t.finished&&t.current&&!t.queued);
  const run=alive?`<span class="dot on"></span> <b>Running</b> <span class=mut>since ${clock(N.runners[0].since)}</span>`:`<span class=dot></span> <b>Not running</b>`+(fin<total?' <span class=mut>- press Start / resume</span>':'');
  $('nowbox').innerHTML=`<div class=row><span class=k>Factory</span><span>${run}</span></div>
   <div class=row><span class=k>Descript</span><span>${busy?`<span class="pill p-run">${esc(busy.job)}</span> ${esc(busy.talk||'')} <span class=mut>${busy.percent!=null?busy.percent+'% &middot; ':''}${esc(busy.note||'')}</span>`:'<span class=mut>idle - no job running this moment</span>'}${N&&N.descript&&N.descript.project_url?` &middot; <a href="${N.descript.project_url}" target=_blank>open project</a>`:''}</span></div>
   <div class=row><span class=k>Working on</span><span>${working.length?working.map(([k,t])=>{const x=t.steps[t.current]||{};return `<b>${esc(k)}</b> <span class=mut>(${x.status==='waiting'?'waiting in line for Descript':NAMES[t.current]})</span>`}).join(', '):'<span class=mut>-</span>'}</span></div>
   <div class=row><span class=k>Queue</span><span>${q.length?'<span class=queue>'+q.map(([k,t])=>`<span class=chip><b>#${t.queued}</b> ${esc(k)} &middot; ${t.size_mb||'?'} MB</span>`).join('')+'</span>':'<span class=mut>empty</span>'}</span></div>
   <div class="mut" style="font-size:12px;margin-top:6px">Descript runs one job per project at a time, so the talks take turns there. Rendering, downloading and loudness run on this PC in parallel.</div>`;
  // ---- rows: working first, then queue order, then failed, then finished
  const rank=t=>t.finished?4:(t.error&&!t.retry)?3:t.queued?2:1;
  talks.sort((a,b)=>rank(a[1])-rank(b[1])||(a[1].queued||0)-(b[1].queued||0)||a[0].localeCompare(b[0]));
  $('rows').innerHTML=talks.map(([k,t])=>{
    const segs=STEPS.map(st=>{const x=t.steps[st]||{};let c='',w=0,lab=NAMES[st];
      if(x.status==='done'){c='done';lab+=x.took?' &middot; '+dur(x.took):''}
      else if(x.status==='running'){const p=stepPct(t,k,st);c='run';w=p.pct;lab+=' '+Math.round(p.pct)+'%'}
      else if(x.status==='waiting'){c='wait';lab='In line &middot; '+dur(secs(x.since))}
      else if(x.status==='failed'){c='fail';lab+=' failed'}
      else if(t.queued){c='q'}
      return `<div class="seg ${c}" title="${esc(x.label||x.note||x.error||NAMES[st])}"><div class=t><div class=f style="width:${c==='run'?w.toFixed(1):c==='done'?100:0}%"></div></div><div class=l>${lab}</div></div>`}).join('');
    let status='',cls='';
    if(t.finished){const qa=(t.steps.qa||{});status=`<span class="pill p-done">Finished ${clock(t.finished)}</span><span class=m>${qa.minutes_after?qa.minutes_after+' min':''}${qa.cut_percent!=null?', '+qa.cut_percent+'% cut':''}${qa.lufs!=null?', '+qa.lufs+' LUFS':''}${(qa.flags||[]).length?' &middot; <span class=warn>'+esc(qa.flags.join(', '))+'</span>':''}</span>`;cls='fin'}
    else if(t.retry){status=`<span class="pill p-wait">Retrying automatically</span><span class=m>${esc(t.retry)}</span>`;cls='act'}
    else if(t.error){status=`<span class="pill p-fail">Failed</span><span class=m>${esc(t.error.slice(0,160))}</span>`}
    else if(t.queued){const ahead=q.filter(([kk,tt])=>tt.queued<t.queued).length;status=`<span class="pill p-q">Queued #${t.queued}</span><span class=m>${ahead?ahead+' talk'+(ahead>1?'s':'')+' ahead':'next up'} &middot; ${t.size_mb||'?'} MB &middot; ~${dur(talkLeft(k,t))} of work</span>`}
    else if(t.current){const x=t.steps[t.current]||{};cls='act';
      if(x.status==='waiting'){status=`<span class="pill p-wait">Waiting in line</span><span class=m>Descript is busy${busy&&busy.talk&&busy.talk!==k?' with '+esc(busy.talk)+' ('+esc(busy.job)+')':''} &middot; ${dur(secs(x.since))} so far</span>`}
      else{const p=stepPct(t,k,t.current);status=`<span class="pill p-run">${VERB[t.current]} ${Math.round(p.pct)}%</span><span class=m>${esc(x.label&&!/^uploading \d+ MB$/.test(x.label)?x.label:'')}${x.label?' &middot; ':''}~${dur(p.left)} left &middot; talk done in ~${dur(talkLeft(k,t))}</span>`}}
    else{status=`<span class="pill p-idle">Not started</span><span class=m>${alive?'':'press Start / resume'}</span>`}
    const btn=t.error&&!t.retry&&!alive?`<button data-k="${encodeURIComponent(k)}" onclick="retry(decodeURIComponent(this.dataset.k))">Retry</button>`:'';
    return `<tr class="${cls}"><td class=who><b>${esc(k)}</b><small>${esc(t.title||'')}</small><small>${t.minutes?t.minutes+' min video &middot; ':''}${t.size_mb?t.size_mb+' MB':''}</small></td><td><div class=pipe>${segs}</div></td><td class=stat>${status}</td><td>${btn}</td></tr>`}).join('');
  $('log').textContent=(S.state.log||[]).slice(-60).reverse().join('\n');
  const jobs=(N&&N.descript&&N.descript.jobs)||[];
  $('jobs').innerHTML='<table class=jobs><tr><th>Talk</th><th>Job</th><th>State</th><th>Started</th></tr>'+jobs.map(x=>`<tr><td>${esc(x.talk||'(not matched)')}</td><td>${esc(x.job)}</td><td>${esc(x.state==='stopped'?(x.note==='success'?'done':x.note):x.state)}${x.state==='running'&&x.percent!=null?' '+x.percent+'%':''}</td><td>${x.minutes<90?x.minutes+' min ago':Math.round(x.minutes/60)+' h ago'}</td></tr>`).join('')+'</table>';
}
async function loadState(){try{S=await j('/api/state?e='+$('ev').value);lastOk=Date.now();render()}catch(e){}}
async function loadNow(){try{N=await j('/api/now?e='+$('ev').value);alive=!!(N.runners&&N.runners.length);render()}catch(e){}}
function tick(){const a=(Date.now()-lastOk)/1000;$('ldot').className='dot'+(a<5?' on':'');$('lupd').textContent=lastOk?(a<5?'live':'updated '+dur(a)+' ago'):'connecting...';if(S)render()}
async function load(){const es=await j('/api/events');$('ev').innerHTML=es.map(e=>`<option value="${e.short_url}">${e.title} (${e.date})${e.started?' - started':''}</option>`).join('');
 $('ev').onchange=()=>{S=null;N=null;loadState();loadNow()};await loadState();loadNow();
 setInterval(loadState,1500);setInterval(loadNow,10000);setInterval(tick,1000)}
async function post(a){const r=await j('/api/'+a,{method:'POST',body:JSON.stringify({e:$('ev').value})});$('msg').textContent=r.msg||'';setTimeout(loadNow,1500)}
async function retry(k){const r=await j('/api/retry',{method:'POST',body:JSON.stringify({e:$('ev').value,speakers:k})});$('msg').textContent=r.msg}
async function toggleSet(){const b=$('setbox');b.open=!b.open;if(b.open){$('yml').value=(await j('/api/settings')).yaml;b.scrollIntoView({behavior:'smooth'})}}
async function saveSet(){const r=await j('/api/settings',{method:'POST',body:JSON.stringify({yaml:$('yml').value})});$('msg').textContent=r.msg}
load();
</script></body></html>
