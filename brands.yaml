# conf42.com/brands (Marek 2026-09-28, proposition A "family grid"): the sister brands and the open-source tools.
# Texts are edited here. Numbers and the "Next:" event are read at build time from each brand's published
# <site>/metadata.yml (its upcoming + past events; the date from the event's own metadata.yml); the values below
# are only the fallback when a site cannot be reached. Conf42's own numbers are counted from this repo.
title: One community, many rooms
lead: >-
  Conf42 is where it started, online, in 2020. Since then the same small team has grown a family of in-person
  events and open-source tools. Here is who does what.

brands:
  - key: conf42
    name: Conf42
    site: https://www.conf42.com/
    sticker: conf42_sticker.png
    color: "#2c3fb0"
    kind: Online
    who: Every corner of software engineering
    text: >-
      30+ online conferences a year on everything from SRE and Kubernetes to Python, Rust and AI. Every talk is free on
      YouTube, with transcripts and slides right here.
    here: true

  - key: sreday
    name: SREday
    site: https://www.sreday.com/
    sticker: sreday_sticker.png
    color: "#7b3fe4"
    kind: In person
    who: SREs, DevOps & platform engineers
    text: >-
      Where Site Reliability Engineers, DevOps practitioners and cloud architects meet face to face: talks from people
      running production at scale, hosted in the offices of companies like Harness, ING and Google.
    fallback: {events: 41, cities: 14, since: 2022}

  - key: llmday
    name: LLMday
    site: https://www.llmday.com/
    sticker: llmday_sticker.png
    color: "#1f9d6b"
    kind: In person
    who: AI & LLM engineers
    text: >-
      AI engineers, ML engineers and data scientists sharing what actually works with LLMs and agents in production:
      evaluation, RAG, guardrails, cost and everything in between.
    fallback: {events: 16, cities: 10, since: 2025}

  - key: platformday
    name: PLATFORMday
    site: https://www.platformday.com/
    sticker: platformday_sticker.png
    color: "#e2971d"
    kind: In person
    who: Platform engineers & DevEx
    text: >-
      For the people who build and run internal platforms: developer experience, infrastructure, golden paths and the
      tooling that ties them together.
    fallback: {events: 2, cities: 2, since: 2026}

  - key: pec
    name: Prompt Engineering Conference
    short: PEC
    site: https://promptengineering.rocks/
    sticker: pec_logo.png
    color: "#d9467a"
    kind: In person
    who: Prompt engineers & AI builders
    text: >-
      From its online beginnings in 2023 to a full day in London, co-located with LLMday London: the craft of
      prompting, agents and AI-assisted work.
    home: London
    fallback: {events: 4, cities: 1, since: 2023}

open_source:
  title: Tools we build and share
  lead: Made for our own events first, free for anyone who runs or speaks at one.
  tools:
    - name: CFP Ninja
      url: https://cfp.ninja/
      sticker: cfpninja_sticker.png
      text: >-
        The open Call for Papers platform we run every CFP on. Speakers find open calls and submit once; organisers
        review in one place.
      cta: Find a stage
    - name: Certified FYI
      url: https://certified.fyi/
      sticker: certifiedfyi_sticker.png
      text: "Verifiable certificates of achievement: organisers issue them, speakers collect them on a public profile."
      cta: See certificates
    - name: Reliaburger
      url: https://reliaburger.com/
      sticker: reliaburger_sticker.png
      text: >-
        A container orchestrator in Rust by Miko: one binary, a complete container platform, zero assembly. Source,
        design notes and a free book on GitHub.
      cta: Read the book
