# "About the conference" panel on every event page (build/about.py, _templates/event.html).
#
# default_blurb: paragraph shown when the panel is expanded ({name} / {year} are the event's).
#   A series may override it with its own `blurb:`.
# series: keyed by short_url minus the year (sre2026 -> sre), so every edition of a series
#   shares one list of 10 topic categories. Keyword matching:
#   - case-insensitive; keywords of <=3 chars match whole words only (plus optional plural "s");
#     longer keywords are word-boundary prefix matches ("observab" matches "observability")
#   - a title hit scores 3, an abstract hit 1; multi-word phrases count double
#   - each talk lands in exactly one category (highest score; the EARLIER category wins ties,
#     so list specific categories before generic ones); unmatched talks go under "...and more"
#   - on the page the categories are sorted by talk count, most talks first

default_blurb: >-
  <strong>Conf42 {name} {year}</strong> is a free online conference for engineers and practitioners.
  All talks premiere on YouTube on the event day and stay available on demand, so you can watch them
  at your own pace. Here is who is presenting and what the talks are about.

