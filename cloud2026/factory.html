ed AI for Deterministic, Adaptive, and Sustainable Robotics"}, {"k": "Cloud_Native_2026_Alagar_Raja_Govindasa_human_automotive_control", "keynote": false, "names": ["Alagar Raja Govindasa"], "p": 1, "title": "Human\u2013AI Collaboration for Reliable Embedded Automotive Control Systems"}, {"k": "Cloud_Native_2026_Mohit_Gupta_gpu_ci_validation", "keynote": false, "names": ["Mohit Gupta"], "p": 1, "title": "Building Robust GPU Performance Validation into CI/CD Pipelines for AI Infrastructure"}, {"k": "Cloud_Native_2026_Roxane_Fischer_context_reasoning_infrastructure", "keynote": false, "names": ["Roxane Fischer"], "p": 1, "title": "Context Engineering for DevOps: Turning Your Infrastructure into a Reasoning Graph"}, {"k": "Cloud_Native_2026_Srinivas_Pagadala_Sekar_gitops_resilience_automation", "keynote": false, "names": ["Srinivas Pagadala Sekar"], "p": 1, "title": "Building Self-Healing CI/CD Pipelines with Tekton and ArgoCD: A GitOps-native Approach to Resilience"}, {"k": "Cloud_Native_2026_Sumit_Kaul_slos_instrumentation_observability", "keynote": false, "names": ["Sumit Kaul"], "p": 1, "title": "Observability as a Platform Contract: Zero-Code Instrumentation and CI/CD-Enforced SLOs"}, {"k": "Cloud_Native_2026_Raghu_Bhupatiraju_predictive_analytics_outages", "keynote": false, "names": ["Raghu Bhupatiraju"], "p": 1, "title": "Predictive Observability: Prevent Supply Chain Outages Before They Break Your Production"}, {"k": "Cloud_Native_2026_Aravind_Sekar_reliability_prevention_ai", "keynote": false, "names": ["Aravind Sekar"], "p": 1, "title": "AI-Powered Reliability: Stop Fighting Fires, Start Preventing Them"}, {"k": "Cloud_Native_2026_Pronnoy_Goswami_observability_queries_context", "keynote": false, "names": ["Pronnoy Goswami"], "p": 1, "title": "From Signal to Insight: Building Queryable Observability with the Model Context Protocol"}, {"k": "Cloud_Native_2026_Gian_Wild_accessibility_security_inclusion", "keynote": false, "names": ["Gian Wild"], "p": 1, "title": "Security and Accessibility can be friends!"}, {"k": "Cloud_Native_2026_Kanika_Gupta_intellectual_enforcement_pipelines", "keynote": false, "names": ["Kanika Gupta"], "p": 1, "title": "ML-Driven IP Detection at Scale: CI/CD Meets Cloud-Native Enforcement"}, {"k": "Cloud_Native_2026_Tilda_Udufo_cicd_quality_testing", "keynote": false, "names": ["Tilda Udufo"], "p": 1, "title": "Green Checkmarks, Red Flags: What CI/CD Can\u0027t Catch"}, {"k": "Cloud_Native_2026_Gurdeep_Gill_firewalls_ai_protection", "keynote": false, "names": ["Gurdeep Gill"], "p": 1, "title": "Building Security Into Your DevOps Pipeline: How NGFWs Protect AI Workloads Without Slowing You Down"}, {"k": "Cloud_Native_2026_Nikolay_Milyaev_xdr_security_analytics", "keynote": false, "names": ["Nikolay Milyaev"], "p": 1, "title": "Defender XDR in the Real World: From Alert Fatigue to Measurable Risk Reduction"}, {"k": "Cloud_Native_2026_Vijayakumar_Venganti_zerotrust_security_networks", "keynote": false, "names": ["Vijayakumar Venganti"], "p": 1, "title": "Zero-Trust Security in DevOps: Automating Trust Verification Across 5G Pipelines"}, {"k": "Cloud_Native_2026_Neal_Iyer_guardrails_ai_accountability", "keynote": false, "names": ["Neal Iyer"], "p": 1, "title": "Guardrails First: Designing Safe, Scalable, and Accountable AI Agents for Security Operations"}, {"k": "Cloud_Native_2026_Bhaskar_Sawant_security_automation_pipelines", "keynote": false, "names": ["Bhaskar Sawant"], "p": 1, "title": "Shift Left, Shield Right: A DevSecOps Playbook for AI-Era CI/CD Pipelines"}, {"k": "Cloud_Native_2026_Vishnu_Prasad_supplychain_reliability_warehouses", "keynote": false, "names": ["Vishnu Prasad"], "p": 1, "title": "SRE for Supply Chain: Building Reliable Human-AI Warehouse Operations at Scale"}, {"k": "Cloud_Native_2026_Akshay_Pratinav_failover_resilience_workloads", "keynote": false, "names": ["Akshay Pratinav"], "p": 1, "title": "The Multi\u2011Workload Challenge: Predictable Failover Across the Stack"}, {"k": "Cloud_Native_2026_Spiros_Economakis_sre_experience_ai", "keynote": false, "names": ["Spiros Economakis"], "p": 1, "title": "How AI is redefining SRE and Customer Experience"}, {"k": "Cloud_Native_2026_Justice_Eziefule_availability_resilience_operations", "keynote": false, "names": ["Justice Eziefule"], "p": 1, "title": "Keeping High-Traffic Systems Running When Things Go Wrong"}, {"k": "Cloud_Native_2026_Binu_Govindan_network_screening_mitigation", "keynote": false, "names": ["Binu Govindan"], "p": 1, "title": "AI-Driven Threat Screening for 5G UPF with Automated Risk Mitigation"}, {"k": "Cloud_Native_2026_Gareth_Emslie_sentinel_security_automation", "keynote": false, "names": ["Gareth Emslie"], "p": 1, "title": "From Zero to a DevSecOps Hero: Extending Microsoft Sentinel"}, {"k": "Cloud_Native_2026_Poshan_Kumar_climate_modeling_food", "keynote": false, "names": ["Poshan Kumar"], "p": 1, "title": "Generative AI Workflows for Climate Risk Modeling in Food Systems"}]}</script>
<script>
  const FE = JSON.parse(document.getElementById('fe-data').textContent);
  const STATES = ['No recording yet', 'Recorded, but not uploaded', 'Uploaded to drive - auto', 'Uploaded to drive - manual', 'Video ready in YouTube', 'Purged talk uploaded'];
  const ORDER = [4, 2, 3, 5, 1, 0];   // the summary from done to not started
  // the crossed eye next to a purged talk's speaker (Marek 2026-11-13)
  const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  let filter = null, last = null;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const norm = s => String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const ago = iso => { if (!iso) return ''; const m = Math.round((Date.now() - new Date(iso)) / 60000);
    return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : new Date(iso).toLocaleDateString([], {day: 'numeric', month: 'short'}); };
  const mins = s => s ? Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0') : '';
  // a manual file is this speaker's when its name holds the speaker's first and last name (any order, accents ignored)
  function nameIn(fileName, name) {
    const words = new Set(norm(fileName.replace(/\.[^.]+$/, '')).split(' ')), parts = norm(name).split(' ').filter(Boolean);
    return parts.length >= 2 ? words.has(parts[0]) && words.has(parts[parts.length - 1]) : parts.length === 1 && words.has(parts[0]);
  }
  async function getJson(url) { try { const r = await fetch(url, {cache: 'no-store'}); return r.ok ? await r.json() : null; } catch (e) { return null; } }

  async function load() {
    if (document.body.classList.contains('locked')) return;
    const raw = 'https://raw.githubusercontent.com/conf42/src/main/_db/factory_runs/' + FE.slug + '/';
    const t = '?t=' + Date.now();
    const [st, yt, intake, state] = await Promise.all([
      FE.status_url ? getJson(FE.status_url + '?status=' + encodeURIComponent(FE.slug)) : Promise.resolve(null),
      getJson(raw + 'youtube.json' + t), getJson(raw + 'intake.json' + t), getJson(raw + 'state.json' + t)]);
    const err = document.getElementById('err');
    err.hidden = !!(st && st.ok) || !FE.status_url;
    if (!err.hidden) err.textContent = 'The upload script did not answer - Drive states may be missing. YouTube states still show.';
    if (!FE.status_url) { err.hidden = false; err.textContent = 'The upload script is not set up yet (metadata.yml record_upload_url) - only YouTube states show.'; }
    last = {st: st || {uploads: [], recorded: {}, manual: []}, yt: yt || {}, intake: (intake || {}).items || {}, state: (state || {}).talks || {}};
    render();
  }

  function rowState(talk, d) {
    const notes = [], who = talk.names.join(' & ');
    const key = talk.k, mine = u => (key && u.k === key) || (!u.k && talk.names.some(n => norm(n) === norm((u.names || []).join(' & ') || u.typed)));
    const autos = d.st.uploads.filter(mine).sort((a, b) => (b.created || '').localeCompare(a.created || ''));
    const done = autos.filter(u => u.status === 'complete');
    const manual = (d.st.manual || []).filter(f => talk.names.some(n => nameIn(f.name, n)));
    const rec = d.st.recorded[key] || Object.values(d.st.recorded).find(r => !r.k && talk.names.some(n => norm(n) === norm((r.names || []).join(' & ') || r.typed)));
    const y = d.yt[who];
    const run = d.state[who];
    // the factory's word on the newest auto upload (held / rejected) and on the talk (where it is in the pipeline)
    if (done[0]) { const i = d.intake[done[0].id]; if (i && i.outcome === 'hold') notes.push(['bad', 'Held: ' + i.reason]); if (i && i.outcome === 'reject') notes.push(['bad', 'Rejected: ' + i.reason + ' - needs a new recording']); }
    if (run && !y) notes.push(['', run.finished ? 'Edited, waiting for the YouTube upload' : run.error ? 'Factory error: ' + String(run.error).slice(0, 120) : 'In the factory' + (run.current ? ': ' + run.current : '')]);
    let s = 0;
    if (y && y.id) {
      s = 4; notes.unshift(['', '<a href="https://youtu.be/' + esc(y.id) + '" target="_blank">youtu.be/' + esc(y.id) + '</a> (' + esc(y.privacy || 'unlisted') + ') · <a href="' + esc(y.studio) + '" target="_blank">Studio</a>' + (y.problem ? ' · ' + esc(y.problem) : '')]);
    } else if (talk.p && (done.length || manual.length)) {
      s = 5; const u = done[0];
      notes.unshift(['', u ? ago(u.finished || u.created) + ' · ' + mins(u.seconds) + ' · auto' : manual.map(f => esc(f.name) + ' (' + ago(f.created) + ', manual)').join('<br>')]);
      notes.push(['', 'The talk was deleted from the lineup - the speaker recorded anyway']);
    } else if (done.length) {
      s = 2; notes.unshift(['', ago(done[0].finished || done[0].created) + ' · ' + mins(done[0].seconds) + (done[0].slides === 'complete' ? ' · with slides' : ' · no slides') + (done.length > 1 ? ' · ' + done.length + ' uploads' : '')]);
      if (manual.length) notes.push(['', 'Also ' + manual.length + ' manual upload' + (manual.length > 1 ? 's' : '')]);
    } else if (manual.length) {
      s = 3; notes.unshift(['', manual.map(f => esc(f.name) + ' (' + ago(f.created) + ')').join('<br>')]);
    } else if (rec || autos.length) {
      s = 1;
      if (autos.length) notes.unshift(['bad', 'Upload started ' + ago(autos[0].created) + ', not finished']);
      else notes.unshift(['', 'Stopped ' + ago(rec.at) + ' · ' + mins(rec.seconds) + (rec.count > 1 ? ' · ' + rec.count + ' takes' : '') + ' · not shared yet']);
    }
    return {s, notes};
  }

  function render() {
    const d = last, counts = [0, 0, 0, 0, 0, 0];
    const rows = FE.talks.map(t => { const r = rowState(t, d); counts[r.s]++; return {t, r}; });
    document.getElementById('sum').innerHTML = ORDER.filter(i => i !== 5 || counts[5]).map(i => '<button data-s="' + i + '" class="' + (filter === i ? 'on' : '') + '"><b>' + counts[i] + '</b><span class="st s' + i + '">' + STATES[i] + '</span></button>').join('');
    document.querySelectorAll('#sum button').forEach(b => b.onclick = () => { const v = +b.dataset.s; filter = filter === v ? null : v; render(); });
    document.getElementById('rows').innerHTML = rows.filter(x => filter === null || x.r.s === filter).map(({t, r}) =>
      '<tr' + (t.p ? ' class="purged"' : '') + '><td class="who"><b>' + esc(t.names.join(' & ')) + '</b>' + (t.p ? '<span class="ghost" title="Purged: no longer in the lineup">' + EYE + 'purged</span>' : '') +
      (t.keynote ? '<small>Keynote</small>' : '') + '</td><td>' + esc(t.title) + '</td>' +
      '<td><span class="st s' + r.s + '">' + STATES[r.s] + '</span>' + r.notes.map(n => '<div class="note ' + n[0] + '">' + n[1] + '</div>').join('') + '</td></tr>').join('');
    // uploads that match nobody on the lineup (the factory holds them)
    const known = new Set(FE.talks.map(t => t.k));
    const stray = d.st.uploads.filter(u => !(u.k && known.has(u.k)) && !FE.talks.some(t => t.names.some(n => norm(n) === norm((u.names || []).join(' & ') || u.typed))));
    document.getElementById('extra').innerHTML = stray.length ? '<h2>Uploads not matched to the lineup</h2><div class="wrap"><table><tbody>' +
      stray.map(u => '<tr><td><b>' + esc((u.names || []).join(' & ') || u.typed || '?') + '</b></td><td>' + esc(u.folder) + '</td><td>' + esc(u.status) + ' · ' + ago(u.created) + '</td></tr>').join('') + '</tbody></table></div>' : '';
    document.getElementById('meta').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) +
      ' · refreshes every minute · manual uploads are matched by the speaker’s name in the file name';
  }
  load(); setInterval(load, 60000);
</script>
