  <style>
    :root { --navy: #1b2a4e; --accent: #7B2726; }
    body { margin: 0; background: #f4f4f6; color: var(--navy); font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
    header { background: var(--navy); color: #fff; padding: 26px 16px 22px; }
    header .in, main { max-width: 1100px; margin: 0 auto; }
    header h1 { margin: 0; font-weight: 800; font-size: 1.7rem; } header p { margin: 4px 0 0; color: #c9d3ee; }

    #gate h2 { margin: 0 0 6px; font-size: 20px; } #gate p { margin: 0 0 14px; color: #6b6b70; font-size: 14px; }

<body>
<div id="gate"><form onsubmit="return enterFactory(event)">
  <h2>Conf42 Cloud Native 2026</h2><p>Team only - enter the factory password.</p>
  <input type="password" id="gate-pw" autocomplete="current-password" autofocus>
  <button type="submit">Enter</button><div class="gerr" id="gate-err"></div></form></div>
<script>
  // the same soft gate as conf42.com/factory (same password, same browser memory): not encryption, keeps casual visitors out
  const GATE = "54b6ca6e5c7e0eb7e2e0cfdda988cb822dcbb539661d3359c1ac12398061d267", TRIES = 5, LOCK_MS = 24 * 3600 * 1000;
  const store = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
                 set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
                 del: k => { try { localStorage.removeItem(k); } catch (e) {} }};
  function lockedUntil() { const u = +(store.get('factory-gate-lock') || 0); return u > Date.now() ? u : 0; }
  function showLock() {
    const u = lockedUntil(); if (!u) return false;
    document.getElementById('gate-pw').disabled = true; document.querySelector('#gate button').disabled = true;
    document.getElementById('gate-err').textContent = 'Too many wrong passwords - closed on this browser until ' + new Date(u).toLocaleString([], {weekday: 'short', hour: '2-digit', minute: '2-digit'}) + '.';
    return true;
  }
  if (store.get('factory-gate') !== GATE) { document.body.classList.add('locked'); showLock(); }
  async function enterFactory(ev) {
    ev.preventDefault();
    if (showLock()) return false;
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(document.getElementById('gate-pw').value.trim()));
    const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    if (hex === GATE) { store.set('factory-gate', GATE); store.del('factory-gate-fails'); store.del('factory-gate-lock'); document.body.classList.remove('locked'); load(); }
    else {
      const n = +(store.get('factory-gate-fails') || 0) + 1;
      if (n >= TRIES) { store.set('factory-gate-lock', String(Date.now() + LOCK_MS)); store.del('factory-gate-fails'); showLock(); }
      else { store.set('factory-gate-fails', String(n)); document.getElementById('gate-err').textContent = 'Not that one. ' + (TRIES - n) + ' tries left before a 24-hour lock.'; }
    }
    return false;
  }
</script>

<script type="application/json" id="fe-data">{"color": "#7B2726", "date": "April 23 2026", "label": "Conf42 Cloud Native 2026", "slug": "cloud2026", "status_url": "", "talks": [{"k": "Cloud_Native_2026_Ryan_Vila_feature_flags_migration", "keynote": true, "names": ["Ryan Vila"], "title": "Beyond the Toggle: Feature Flags as Your Cloud-Native Migration Safety Net"}, {"k": "Cloud_Native_2026_Andrew_Espira_ai_agents_automation", "keynote": false, "names": ["Andrew Espira"], "title": "agentctl: A CLI for Managing AI Agents and MCP Servers Like Infrastructure"}, {"k": "Cloud_Native_2026_Bhavika_Reddy_Jalli_ai_agents_decisioning", "keynote": false, "names": ["Bhavika Reddy Jalli"], "title": "Responsible Agentic AI for Equitable and Sustainable Cloud Native Telecom"}, {"k": "Cloud_Native_2026_Dhivya_Dhayakar_ai_llm_prompts", "keynote": false, "names": ["Dhivya Dhayakar"], "title": "Cloud-Native Intent Orchestration for Enterprise AI Ecosystems"}, {"k": "Cloud_Native_2026_Elizabeth_Fuentes_Leone_ai_llm_applications", "keynote": false, "names": ["Elizabeth Fuentes Leone"], "title": "Reduce AI Agents Costs and Mistakes with Semantic tool Selection"}, {"k": "Cloud_Native_2026_Sandeep_Mannapur_ai_agents_workflows", "keynote": false, "names": ["Sandeep Mannapur"], "title": "Engineering Production-Grade Multi-Agent Systems in the Cloud"}, {"k": "Cloud_Native_2026_Dreema_Patel_ai_llm_inference", "keynote": false, "names": ["Dreema Patel"], "title": "AI as a Force Multiplier for Cloud Native Enterprise Development"}, {"k": "Cloud_Native_2026_Gaurav_Kumar_cloudarchitecture_microservices_backend", "keynote": false, "names": ["Gaurav Kumar"], "title": "Context-Aware AI Development: Unlocking the Next Wave of Engineering Productivity"}, {"k": "Cloud_Native_2026_Mallikarjuna_Muchu_security_cloud_compliance", "keynote": false, "names": ["Mallikarjuna Muchu"], "title": "Cloud-Native AI Infrastructure Transforming Modern Agriculture"}, {"k": "Cloud_Native_2026_Devinder_Tokas_cloudarchitecture_backend_systems", "keynote": false, "names": ["Devinder Tokas"], "title": "Interoperability by Design for Cloud-Native Workflows"}, {"k": "Cloud_Native_2026_Ran_Tao_data_analytics_insights", "keynote": false, "names": ["Ran Tao"], "title": "Migration from On-Prem Messaging System to The Cloud: What, How and Why"}, {"k": "Cloud_Native_2026_Purushotham_Jinka_ai_llm_optimization", "keynote": false, "names": ["Purushotham Jinka"], "title": "Database Evolution: Partitioning and Indexing for Cloud-Native Systems"}, {"k": "Cloud_Native_2026_Sonali_Priya_data_pipelines_processing", "keynote": false, "names": ["Sonali Priya"], "title": "Design Systems for Scalable Cloud-Native Analytics Platforms"}, {"k": "Cloud_Native_2026_Cijin_Lonappan_Kappani_devops_cicd_automation", "keynote": false, "names": ["Cijin Lonappan Kappani"], "title": "Autonomous Delivery and Multi-Modal Fulfillment in Cloud Native Commerce"}, {"k": "Cloud_Native_2026_Mohiadeen_Ameer_ai_agents_automation", "keynote": false, "names": ["Mohiadeen Ameer"], "title": "Event-Driven Validation for Cloud-Native Resilience"}, {"k": "Cloud_Native_2026_Dmytro_Hlotenko_distributed_systems_resilience", "keynote": false, "names": ["Dmytro Hlotenko"], "title": "Keep Calm and Run on AWS: Engineering Compliance Without Abandoning Your Stack"}, {"k": "Cloud_Native_2026_Karthik_Ravva_ai_agents_reasoning", "keynote": false, "names": ["Karthik Ravva"], "title": "Cloud-Native Data Lifecycle Governance for Trusted AI \u0026 BI"}, {"k": "Cloud_Native_2026_Manasa_Uppula_data_streaming_realtime", "keynote": false, "names": ["Manasa Uppula"], "title": "Designing Compliant Digital Onboarding: Cloud-Native Architectures for Trustworthy, Audit-Ready Financial Services"}, {"k": "Cloud_Native_2026_Sampath_Rao_Madarapu_distributed_systems_scaling", "keynote": false, "names": ["Sampath Rao Madarapu"], "title": "AI-Augmented Azure Ops: Copilot for Intelligent Cloud Resource Management"}, {"k": "Cloud_Native_2026_Uudit_Misra_distributed_systems_reliability", "keynote": false, "names": ["Uudit Misra"], "title": "Beyond Dashboards: Deep-Dive Network Observability with eBPF"}, {"k": "Cloud_Native_2026_Gautham_Paspala_data_warehousing_analytics", "keynote": false, "names": ["Gautham Paspala"], "title": "Cloud-Native Friendly Fraud Detection with Temporal Graph Attention and Transformers"}, {"k": "Cloud_Native_2026_Sharath_Reddy_Polu_cloudarchitecture_backend_infra", "keynote": false, "names": ["Sharath Reddy Polu"], "title": "Behavioral Analytics for Real-Time Fraud Prevention"}, {"k": "Cloud_Native_2026_Vaishali_Mahavratayajula_distributed_systems_performance", "keynote": false, "names": ["Vaishali Mahavratayajula"], "title": "Security in Your Pocket: AI Risk Assessment for Cloud-Native SMBs"}, {"k": "Cloud_Native_2026_Aleksandr_Pinaev_security_vulnerabilities_compliance", "keynote": false, "names": ["Aleksandr Pinaev"], "title": "Cloud MCP Servers Under Fire: Security Risks, Vulnerability Patterns, and Practical Defenses"}, {"k": "Cloud_Native_2026_Aleksandra_Drobnjak_security_zerotrust_encryption", "keynote": false, "names": ["Aleksandra Drobnjak"], "title": "Azure Attacks Unpacked: Real-World Threats and Lessons Learned"}, {"k": "Cloud_Native_2026_Leo_Visser_cloudarchitecture_infra_design", "keynote": false, "names": ["Leo Visser"], "title": "Secure your cloud automation"}, {"k": "Cloud_Native_2026_Rajasingh_Gandhi_Ramdas_distributed_systems_architecture", "keynote": false, "names": ["Rajasingh Gandhi Ramdas"], "title": "Post-Quantum Cryptography: Securing Multi-Cloud APIs Against Quantum Threats"}, {"k": "Cloud_Native_2026_Murtuza_J_Merchant_stablecoins_payment", "keynote": false, "names": ["Murtuza J Merchant"], "title": "Stablecoins as Cloud-Native Payment Infrastructure"}, {"k": "Cloud_Native_2026_Anton_Solomonov_computer_vision_verification", "keynote": false, "names": ["Anton Solomonov"], "title": "Building a Production Computer Vision Verification System for Warehouse Receiving"}]}</script>
<script>
  const FE = JSON.parse(document.getElementById('fe-data').textContent);
  const STATES = ['No recording yet', 'Recorded, but not uploaded', 'Uploaded to drive - auto', 'Uploaded to drive - manual', 'Video ready in YouTube'];
  const ORDER = [4, 2, 3, 1, 0];   // the summary from done to not started
  let filter = null, last = null;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const norm = s => String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const ago = iso => { if (!iso) return ''; const m = Math.round((Date.now() - new Date(iso)) / 60000);
    return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : new Date(iso).toLocaleDateString([], {day: 'numeric', month: 'short'}); };
  const mins = s => s ? Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0') : '';
  // a manual file is this speaker's when its name holds the speaker's first and last name (any order, accents ignored)
  function nameIn(fileName, name) {
    const words = new Set(norm(fileName.replace(/\.[^.]+$/, '')).split(' ')), parts = norm(name).split(' ').filter(Boolean);
    return parts.length >= 2 ? words.has(parts[0]) && words.has(parts[parts.length - 1]) : parts.length === 1 && words.has(parts[0]);
  }
  async function getJson(url) { try { const r = await fetch(url, {cache: 'no-store'}); return r.ok ? await r.json() : null; } catch (e) { return null; } }

  async function load() {
    if (document.body.classList.contains('locked')) return;
    const raw = 'https://raw.githubusercontent.com/conf42/src/main/_db/factory_runs/' + FE.slug + '/';
    const t = '?t=' + Date.now();
    const [st, yt, intake, state] = await Promise.all([
      FE.status_url ? getJson(FE.status_url + '?status=' + encodeURIComponent(FE.slug)) : Promise.resolve(null),
      getJson(raw + 'youtube.json' + t), getJson(raw + 'intake.json' + t), getJson(raw + 'state.json' + t)]);
    const err = document.getElementById('err');
    err.hidden = !!(st && st.ok) || !FE.status_url;
    if (!err.hidden) err.textContent = 'The upload script did not answer - Drive states may be missing. YouTube states still show.';
    if (!FE.status_url) { err.hidden = false; err.textContent = 'The upload script is not set up yet (metadata.yml record_upload_url) - only YouTube states show.'; }
    last = {st: st || {uploads: [], recorded: {}, manual: []}, yt: yt || {}, intake: (intake || {}).items || {}, state: (state || {}).talks || {}};
    render();
  }

  function rowState(talk, d) {
    const notes = [], who = talk.names.join(' & ');
    const key = talk.k, mine = u => (key && u.k === key) || (!u.k && talk.names.some(n => norm(n) === norm((u.names || []).join(' & ') || u.typed)));
    const autos = d.st.uploads.filter(mine).sort((a, b) => (b.created || '').localeCompare(a.created || ''));
    const done = autos.filter(u => u.status === 'complete');
    const manual = (d.st.manual || []).filter(f => talk.names.some(n => nameIn(f.name, n)));
    const rec = d.st.recorded[key] || Object.values(d.st.recorded).find(r => !r.k && talk.names.some(n => norm(n) === norm((r.names || []).join(' & ') || r.typed)));
    const y = d.yt[who];
    const run = d.state[who];
    // the factory's word on the newest auto upload (held / rejected) and on the talk (where it is in the pipeline)
    if (done[0]) { const i = d.intake[done[0].id]; if (i && i.outcome === 'hold') notes.push(['bad', 'Held: ' + i.reason]); if (i && i.outcome === 'reject') notes.push(['bad', 'Rejected: ' + i.reason + ' - needs a new recording']); }
    if (run && !y) notes.push(['', run.finished ? 'Edited, waiting for the YouTube upload' : run.error ? 'Factory error: ' + String(run.error).slice(0, 120) : 'In the factory' + (run.current ? ': ' + run.current : '')]);
    let s = 0;
    if (y && y.id) {
      s = 4; notes.unshift(['', '<a href="https://youtu.be/' + esc(y.id) + '" target="_blank">youtu.be/' + esc(y.id) + '</a> (' + esc(y.privacy || 'unlisted') + ') · <a href="' + esc(y.studio) + '" target="_blank">Studio</a>' + (y.problem ? ' · ' + esc(y.problem) : '')]);
    } else if (done.length) {
      s = 2; notes.unshift(['', ago(done[0].finished || done[0].created) + ' · ' + mins(done[0].seconds) + (done[0].slides === 'complete' ? ' · with slides' : ' · no slides') + (done.length > 1 ? ' · ' + done.length + ' uploads' : '')]);
      if (manual.length) notes.push(['', 'Also ' + manual.length + ' manual upload' + (manual.length > 1 ? 's' : '')]);
    } else if (manual.length) {
      s = 3; notes.unshift(['', manual.map(f => esc(f.name) + ' (' + ago(f.created) + ')').join('<br>')]);
    } else if (rec || autos.length) {
      s = 1;
      if (autos.length) notes.unshift(['bad', 'Upload started ' + ago(autos[0].created) + ', not finished']);
      else notes.unshift(['', 'Stopped ' + ago(rec.at) + ' · ' + mins(rec.seconds) + (rec.count > 1 ? ' · ' + rec.count + ' takes' : '') + ' · not shared yet']);
    }
    return {s, notes};
  }

  function render() {
    const d = last, counts = [0, 0, 0, 0, 0];
    const rows = FE.talks.map(t => { const r = rowState(t, d); counts[r.s]++; return {t, r}; });
    document.getElementById('sum').innerHTML = ORDER.map(i => '<button data-s="' + i + '" class="' + (filter === i ? 'on' : '') + '"><b>' + counts[i] + '</b><span class="st s' + i + '">' + STATES[i] + '</span></button>').join('');
    document.querySelectorAll('#sum button').forEach(b => b.onclick = () => { const v = +b.dataset.s; filter = filter === v ? null : v; render(); });
    document.getElementById('rows').innerHTML = rows.filter(x => filter === null || x.r.s === filter).map(({t, r}) =>
      '<tr><td class="who"><b>' + esc(t.names.join(' & ')) + '</b>' + (t.keynote ? '<small>Keynote</small>' : '') + '</td><td>' + esc(t.title) + '</td>' +
      '<td><span class="st s' + r.s + '">' + STATES[r.s] + '</span>' + r.notes.map(n => '<div class="note ' + n[0] + '">' + n[1] + '</div>').join('') + '</td></tr>').join('');
    // uploads that match nobody on the lineup (the factory holds them)
    const known = new Set(FE.talks.map(t => t.k));
    const stray = d.st.uploads.filter(u => !(u.k && known.has(u.k)) && !FE.talks.some(t => t.names.some(n => norm(n) === norm((u.names || []).join(' & ') || u.typed))));
    document.getElementById('extra').innerHTML = stray.length ? '<h2>Uploads not matched to the lineup</h2><div class="wrap"><table><tbody>' +
      stray.map(u => '<tr><td><b>' + esc((u.names || []).join(' & ') || u.typed || '?') + '</b></td><td>' + esc(u.folder) + '</td><td>' + esc(u.status) + ' · ' + ago(u.created) + '</td></tr>').join('') + '</tbody></table></div>' : '';
    document.getElementById('meta').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) +
      ' · refreshes every minute · manual uploads are matched by the speaker’s name in the file name';
  }
  load(); setInterval(load, 60000);
</script>
