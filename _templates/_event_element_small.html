          <!-- EVENT -->
          <div class="col-12 col-md-6 col-lg-4 d-flex {{ extra_class | default('')}}">

            <!-- Card -->
            <div{% if event.color %} style="--ev: {{ event.color }}"{% endif %} class="card mb-6 mb-lg-0 shadow-light-lg lift lift-lg">

              {% if event.cfp_open %}
              <div class="col-12">
                <!-- Badge -->
                <span class="badge rounded-pill badge-cfp badge-float badge-float-outside">
                  <a href="{{ event.cfp_url }}" target="_blank">
                    <span class="h6 text-uppercase">Apply to speak</span>
                  </a>
                </span>
              </div>
              {% endif %}
              <!-- Image -->
              <a class="card-img-top" href="{{ event.url }}">
                <img src="{{ event.thumbnail_path | default(picture_placeholder, True) }}" alt="{{ event.name }} {{ event.year }}" class="img-fluid" loading="lazy" style="aspect-ratio: auto 2 / 1;">
              </a>
              <!-- Body -->
              <a class="card-body px-3 text-center" href="{{ event.url }}">
                <!-- Heading -->
                <h3 class="c42-fit" style="--len: {{ (event.name ~ ' ' ~ event.year) | length }}">
                  {{ event.name }} {{ event.year }}
                </h3>
                <!-- Text -->
                <p class="mb-0 text-muted">
                  <!-- {{ event.description }} -->
                </p>
              </a>
              <!-- Meta -->
              <a class="card-meta" href="{{ event.url }}">
                <!-- Divider -->
                <hr class="card-meta-divider">
                <!-- Author -->
                <h6 class="text-uppercase text-muted me-2 mb-0">
                  {{ event.location }}
                </h6>
                <!-- Date -->
                <p class="h6 text-uppercase text-muted mb-0 ms-auto">
                  <time datetime="{{ event.date }}">{{ event.date | long_date }}</time>
                </p>
              </a>
            </div>
          </div>
