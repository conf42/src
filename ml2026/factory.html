<script>

  const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  let filter = null, last = null;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const norm = s => String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const ago = iso => { if (!iso) return ''; const m = Math.round((Date.now() - new Date(iso)) / 60000);
    return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : new Date(iso).toLocaleDateString([], {day: 'numeric', month: 'short'}); };
  const mins = s => s ? Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0') : '';
  // a manual file is this speaker's when its name holds the speaker's first and last name (any order, accents ignored)
  function nameIn(fileName, name) {
    const words = new Set(norm(fileName.replace(/\.[^.]+$/, '')).split(' ')), parts = norm(name).split(' ').filter(Boolean);
    return parts.length >= 2 ? words.has(parts[0]) && words.has(parts[parts.length - 1]) : parts.length === 1 && words.has(parts[0]);
  }
  async function getJson(url) { try { const r = await fetch(url, {cache: 'no-store'}); return r.ok ? await r.json() : null; } catch (e) { return null; } }

  async function load() {
    if (document.body.classList.contains('locked')) return;

    const t = '?t=' + Date.now();

    if (!FE.status_url) { err.hidden = false; err.textContent = 'The upload script is not set up yet (metadata.yml record_upload_url) - only YouTube states show.'; }
    last = {st: st || {uploads: [], recorded: {}, manual: []}, yt: yt || {}, intake: (intake || {}).items || {}, state: (state || {}).talks || {}};
    render();
  }

  function rowState(talk, d) {
    const notes = [], who = talk.names.join(' & ');
    const key = talk.k, mine = u => (key && u.k === key) || (!u.k && talk.names.some(n => norm(n) === norm((u.names || []).join(' & ') || u.typed)));

    const y = d.yt[who];
    const run = d.state[who];
    // the factory's word on the newest auto upload (held / rejected) and on the talk (where it is in the pipeline)
    if (done[0]) { const i = d.intake[done[0].id]; if (i && i.outcome === 'hold') notes.push(['bad', 'Held: ' + i.reason]); if (i && i.outcome === 'reject') notes.push(['bad', 'Rejected: ' + i.reason + ' - needs a new recording']); }

      s = 5; const u = done[0];
      notes.unshift(['', u ? ago(u.finished || u.created) + ' · ' + mins(u.seconds) + ' · auto' : manual.map(f => esc(f.name) + ' (' + ago(f.created) + ', manual)').join('<br>')]);
      notes.push(['', 'The talk was deleted from the lineup - the speaker recorded anyway']);
    } else if (done.length) {
      s = 2; notes.unshift(['', ago(done[0].finished || done[0].created) + ' · ' + mins(done[0].seconds) + (done[0].slides === 'complete' ? ' · with slides' : ' · no slides') + (done.length > 1 ? ' · ' + done.length + ' uploads' : '')]);
      if (manual.length) notes.push(['', 'Also ' + manual.length + ' manual upload' + (manual.length > 1 ? 's' : '')]);
    } else if (manual.length) {
      s = 3; notes.unshift(['', manual.map(f => esc(f.name) + ' (' + ago(f.created) + ')').join('<br>')]);
    } else if (rec || autos.length) {
      s = 1;
      if (autos.length) notes.unshift(['bad', 'Upload started ' + ago(autos[0].created) + ', not finished']);
      else if (rec.aborted) { s = 6; notes.unshift(['', 'Aborted ' + ago(rec.aborted_at || rec.at) + ' · ' + mins(rec.seconds) + (rec.count > 1 ? ' · ' + rec.count + ' takes' : '') + ' · the speaker chose to start over']); }
      else notes.unshift(['', 'Stopped ' + ago(rec.at) + ' · ' + mins(rec.seconds) + (rec.count > 1 ? ' · ' + rec.count + ' takes' : '') + ' · not shared yet']);
    }
    return {s, notes};
  }

  function render() {

    const rows = FE.talks.map(t => { const r = rowState(t, d); counts[r.s]++; return {t, r}; });
    document.getElementById('sum').innerHTML = ORDER.filter(i => i !== 5 || counts[5]).map(i => '<button data-s="' + i + '" class="' + (filter === i ? 'on' : '') + '"><b>' + counts[i] + '</b><span class="st s' + i + '">' + STATES[i] + '</span></button>').join('');
    document.querySelectorAll('#sum button').forEach(b => b.onclick = () => { const v = +b.dataset.s; filter = filter === v ? null : v; render(); });
    document.getElementById('rows').innerHTML = rows.filter(x => filter === null || x.r.s === filter).map(({t, r}) =>
      '<tr' + (t.p ? ' class="purged"' : '') + '><td class="who"><b>' + esc(t.names.join(' & ')) + '</b>' + (t.p ? '<span class="ghost" title="Purged: no longer in the lineup">' + EYE + 'purged</span>' : '') +
      (t.keynote ? '<small>Keynote</small>' : '') + '</td><td>' + esc(t.title) + '</td>' +
      '<td><span class="st s' + r.s + '">' + STATES[r.s] + '</span>' + r.notes.map(n => '<div class="note ' + n[0] + '">' + n[1] + '</div>').join('') + '</td></tr>').join('');
    // uploads that match nobody on the lineup (the factory holds them)
    const known = new Set(FE.talks.map(t => t.k));
    const stray = d.st.uploads.filter(u => !(u.k && known.has(u.k)) && !FE.talks.some(t => t.names.some(n => norm(n) === norm((u.names || []).join(' & ') || u.typed))));
    document.getElementById('extra').innerHTML = stray.length ? '<h2>Uploads not matched to the lineup</h2><div class="wrap"><table><tbody>' +
      stray.map(u => '<tr><td><b>' + esc((u.names || []).join(' & ') || u.typed || '?') + '</b></td><td>' + esc(u.folder) + '</td><td>' + esc(u.status) + ' · ' + ago(u.created) + '</td></tr>').join('') + '</tbody></table></div>' : '';
    document.getElementById('meta').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) +
      ' · refreshes every minute · manual uploads are matched by the speaker’s name in the file name';
  }
  load(); setInterval(load, 60000);
</script>
</body>
